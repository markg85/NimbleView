[package]
name = "nimbleview"
description = "A fast image viewer that supports a wide range of formats."
version = "2.6.2"
license = "GPLv2"
edition = "2024"
authors = ["The NimbleView developers"]
repository = "https://github.com/dividebysandwich/NimbleView"

[dependencies]
const_format = "0.2.36"
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "ico", "tiff", "tga", "webp", "pnm", "rayon", "avif-native"] }
libjpeg-turbo-rs = "0.6.2"
rand = "0.10.1"
log = "0.4.32"
env_logger = "0.11.10"
arboard = { version = "3.2.1", features = ["wayland-data-control"] }
rustronomy-fits = "0.2"
ndarray = "0.15"
rawler = { git = "https://patched@github.com/dividebysandwich/dnglab.git", rev="06dc3dab" }
imagepipe = { git = "https://github.com/dividebysandwich/imagepipe", rev="cc9df677"}
rayon = "1.12.0"
jxl = "0.4.3"
sysinfo = { version = "0.39.3", default-features = false, features = ["system"] }
anyhow = "1"
thorvg = "0.4.2"

[profile.release]
opt-level = 3
debug = true
incremental = true
codegen-units = 256

[patch."https://github.com/dividebysandwich/dnglab"]
rawler = { git = "https://patched@github.com/dividebysandwich/dnglab.git", rev = "06dc3dab" }
